# SYNNER CRM - Docker Compose Producción
# Configuración para despliegue autoalojado con reverse proxy (Nginx).
# NOTA: la BD recomendada es Supabase (gestionada). El servicio 'postgres' de abajo
# solo es necesario si prefieres alojar PostgreSQL tú mismo; en ese caso apunta
# DATABASE_URL/DIRECT_URL a este contenedor. Si usas Supabase, puedes omitirlo.

version: '3.9'

services:
  # PostgreSQL - Solo si NO usas Supabase (BD autoalojada)
  postgres:
    image: postgres:16-alpine
    container_name: synner_crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Copias de seguridad automáticas cada 24h
      POSTGRES_INITDB_ARGS: "--auth=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - synner_crm_network

  # Backend Node.js
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      args:
        - NODE_ENV=production
    container_name: synner_crm_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3000
      - NODE_ENV=production
      - PUBLIC_SERVER_URL=${PUBLIC_SERVER_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - CORS_EXTRA_ORIGINS=${CORS_EXTRA_ORIGINS}
      - BRAND_NAME=${BRAND_NAME}
      - BRAND_TAGLINE=${BRAND_TAGLINE}
      - ADMIN_NOTIFICATION_EMAIL=${ADMIN_NOTIFICATION_EMAIL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_SERVICE_ACCOUNT_KEY_PATH=${GOOGLE_SERVICE_ACCOUNT_KEY_PATH}
      - GOOGLE_DRIVE_FOLDER_ID=${GOOGLE_DRIVE_FOLDER_ID}
      - GOOGLE_SHEET_MASTER_ID=${GOOGLE_SHEET_MASTER_ID}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - APIFY_API_TOKEN=${APIFY_API_TOKEN}
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN}
      - WHATSAPP_PHONE_ID=${WHATSAPP_PHONE_ID}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET}
      - WHATSAPP_DEFAULT_AGENCIA_ID=${WHATSAPP_DEFAULT_AGENCIA_ID}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - PORTALES_FEED_TOKEN=${PORTALES_FEED_TOKEN}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
    expose:
      - "3000"
    networks:
      - synner_crm_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend React (Vite) - servido como estático
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: synner_crm_frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=${PUBLIC_SERVER_URL}
      - NODE_ENV=production
    networks:
      - synner_crm_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx - Reverse proxy con SSL/TLS
  nginx:
    image: nginx:alpine
    container_name: synner_crm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - synner_crm_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  nginx_logs:

networks:
  synner_crm_network:
    driver: bridge
